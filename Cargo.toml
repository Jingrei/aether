[workspace]
resolver = "2"
members = ["engine", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Keep DSP fast even in debug builds so the app is usable while developing.
[profile.dev.package.aether-engine]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
